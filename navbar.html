<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <!-- Estilos Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <!-- Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Identidad Marca -->
    <link href="./css/styles.css" rel="stylesheet">
    
</head>
<body>

<!-- Navbar Barra de Navegacion-->    
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top c-navbar">
        <div class="container">
            <a class="navbar-brand c-navbar__brand" href="index.html">
                <i class="bi bi-box-seam me-2"></i>
                <strong>SmartStock</strong>
            </a>

            <!-- Switch Modo Oscuro -->
            <div class="form-check form-switch ms-auto">
                <input class="form-check-input" type="checkbox" id="darkModeSwitch">
                <label class="form-check-label text-light small" for="darkModeSwitch">
                    <span id="themeIcon">🌙</span>
                </label>
            </div>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto c-navbar__nav">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="inventario.html">Inventario</a></li>
                    <li class="nav-item"><a class="nav-link" href="reservas.html">Reservas</a></li>
                    <li class="nav-item ms-lg-3">
                        <button class="btn btn-outline-light c-navbar__login-btn" 
                            data-bs-toggle="modal" 
                            data-bs-target="#loginModal">
                            <i class="bi bi-person-circle me-1"></i> Acceso
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

<!-- Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        
        // --- 1. MODO OSCURO ---
        const darkModeSwitch = document.getElementById('darkModeSwitch');
        const htmlElement = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');

        const applyTheme = (theme) => {
            htmlElement.setAttribute('data-bs-theme', theme);
            darkModeSwitch.checked = theme === 'dark';
            themeIcon.innerText = theme === 'dark' ? '☀️' : '🌙';
        };

        applyTheme(localStorage.getItem('theme') || 'light');

        darkModeSwitch.addEventListener('change', () => {
            const theme = darkModeSwitch.checked ? 'dark' : 'light';
            applyTheme(theme);
            localStorage.setItem('theme', theme);
        });

        // --- 2. DEVOLUCIONES ---
        const modalFicha = document.getElementById('modalFicha');
        const btnProcesarDev = document.getElementById('btnProcesarDevolucion');
        const checkIncidencia = document.getElementById('checkIncidencia');
        const seccionIncidencia = document.getElementById('seccionIncidencia');
        const feedbackExitoDev = document.getElementById('feedbackExito');

        // Usamos esta variable para recordar qué botón/card disparó el modal
        let triggerButton = null;

        if (modalFicha) {
            const bsModalFicha = bootstrap.Modal.getOrCreateInstance(modalFicha);

            modalFicha.addEventListener('show.bs.modal', event => {
            const b = event.relatedTarget;
            triggerButton = b; // guardamos el botón que abrió el modal

            document.getElementById('fichaTitulo').innerText = b.getAttribute('data-nombre');
            document.getElementById('fichaUsuario').innerText = b.getAttribute('data-usuario');
            document.getElementById('fichaPatrimonio').innerText = b.getAttribute('data-id');
            document.getElementById('fichaVence').innerText = b.getAttribute('data-vence');
            document.getElementById('fichaImg').src = b.getAttribute('data-img');

            checkIncidencia.checked = false;
            seccionIncidencia.classList.add('d-none');
            feedbackExitoDev.classList.add('d-none');
            btnProcesarDev.classList.remove('d-none');
            btnProcesarDev.className = "btn btn-action w-100 mt-3";
            btnProcesarDev.innerText = "Confirmar Reingreso";
            });

            checkIncidencia.addEventListener('change', () => {
            const conIncidencia = checkIncidencia.checked;
            seccionIncidencia.classList.toggle('d-none', !conIncidencia);
            btnProcesarDev.innerText = conIncidencia ? "Reportar Daño y Devolver" : "Confirmar Reingreso";
            btnProcesarDev.classList.toggle('btn-danger', conIncidencia);
            btnProcesarDev.classList.toggle('btn-action', !conIncidencia);
            });

            btnProcesarDev.addEventListener('click', () => {
            btnProcesarDev.classList.add('d-none');
            feedbackExitoDev.classList.remove('d-none');

            // Ocultar la card asociada en la sección "Equipos en préstamo"
            if (triggerButton) {
                // .c-card es el contenedor; .col-* es la columna Bootstrap
                const card = triggerButton.closest('.c-card');
                const col = triggerButton.closest('.col-12, .col-md-6, .col-lg-4') || card;
                if (col) {
                col.classList.add('fade');     // si usás .fade de Bootstrap
                col.classList.add('show');     // para animación suave, opcional
                // o simplemente:
                col.style.transition = 'opacity 0.3s, transform 0.3s';
                col.style.opacity = '0';
                col.style.transform = 'scale(0.95)';

                setTimeout(() => {
                    col.remove(); // quita la card del DOM
                }, 300);
                }
            }

            // Cerrar modal luego del feedback
            setTimeout(() => {
                const bsInstance = bootstrap.Modal.getInstance(modalFicha) || bsModalFicha;
                bsInstance.hide();
            }, 800);
            });
        }

        // --- 3. RESERVAS / RETIRO (sin reload, solo feedback y reset) ---
        const resModal = document.getElementById('reservaModal');
        const tipoOp = document.getElementById('tipoOperacion');
        const grupoFecha = document.getElementById('grupoFechaRetiro');
        const btnConfirmRes = document.getElementById('btnConfirmarReserva');

        if (resModal) {
            const bsReservaModal = bootstrap.Modal.getOrCreateInstance(resModal);

            resModal.addEventListener('show.bs.modal', e => {
                const categoria = e.relatedTarget.getAttribute('data-categoria');
                const inputCategoria = document.getElementById('modalCategoriaLabel');

                inputCategoria.value = categoria; // recibe el valor del atributo catgoria
                inputCategoria.readOnly = true; // esto asegura que no se modifique

                document.getElementById('feedbackReservaExito').classList.add('d-none');
                btnConfirmRes.classList.remove('d-none');
                btnConfirmRes.innerText = "Confirmar Retiro";
                grupoFecha.classList.add('d-none');
                tipoOp.value = 'retiro';
                document.getElementById('formReserva').reset();
            });

            tipoOp.addEventListener('change', () => {
                const isReserva = tipoOp.value === 'reserva';
                grupoFecha.classList.toggle('d-none', !isReserva);
                btnConfirmRes.innerText = isReserva ? "Confirmar Reserva" : "Confirmar Retiro";
            });

            document.getElementById('formReserva').addEventListener('submit', (e) => {
            e.preventDefault();
            btnConfirmRes.classList.add('d-none');

            const texto = tipoOp.value === 'reserva'
                ? "¡Reserva Exitosa!"
                : "¡Retiro Exitoso!";

            document.getElementById('textoExitoReserva').innerText = texto;
            document.getElementById('feedbackReservaExito').classList.remove('d-none');

            setTimeout(() => {
                // Cerrar modal y limpiar formulario
                const bsInstance = bootstrap.Modal.getInstance(resModal) || bsReservaModal;
                bsInstance.hide();
                document.getElementById('formReserva').reset();
            }, 1000);
            });
        }
        });
</script>

</body>
</html>
