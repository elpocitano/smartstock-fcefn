<!DOCTYPE html>
<html>
<head>
    <title>Test Supabase</title>
    <script src="config.js"></script>
    <script type="module">
        import { supabase } from './src/shared/supabaseClient.js';
        
        async function test() {
            console.log('🔍 Probando conexión a Supabase...');
            const { data, error } = await supabase.from('equipment').select('*').limit(3);
            if (error) {
                console.error('❌ Error:', error);
            } else {
                console.log('✅ Conexión exitosa. Equipos:', data);
            }
        }
        test();
    </script>
</head>
<body>
    <h1>Test Supabase - Abre la consola (F12)</h1>
</body>
</html>
